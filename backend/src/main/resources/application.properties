spring.application.name=centro-ti-api
server.port=${PORT:8084}

spring.datasource.url=jdbc:h2:file:./data/centro-ti;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

spring.jackson.serialization.write-dates-as-timestamps=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4300,http://127.0.0.1:4300}
app.unifi.base-url=${UNIFI_BASE_URL:https://api.ui.com}
app.unifi.api-key=${UNIFI_API_KEY:}
app.unifi.timeout-seconds=${UNIFI_TIMEOUT_SECONDS:12}
