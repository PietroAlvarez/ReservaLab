services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: centro_ti
      POSTGRES_USER: centro_ti
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - centro_ti_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centro_ti -d centro_ti"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://database:5432/centro_ti
      DATABASE_USERNAME: centro_ti
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      UNIFI_BASE_URL: https://api.ui.com
      UNIFI_API_KEY: ${UNIFI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4300}
    ports:
      - "127.0.0.1:8084:8084"

volumes:
  centro_ti_postgres:
